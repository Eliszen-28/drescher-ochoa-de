<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="community-diagram-title community-diagram-desc"><title id="community-diagram-title">Drei Dimensionen einer Bildungsgemeinschaft</title><desc id="community-diagram-desc">Ein petrolfarbener Kreis umfasst Junge Menschen, Eltern und Lernbegleiter. Ein Dreieck verbindet die Dimensionen personal oben in Blau, ethisch links in Türkis und systemisch rechts in Gelb.</desc><circle cx="400" cy="400" r="330" fill="#F5F5F5" stroke="#102A43" stroke-width="6"/><path d="M400 160 170 620H630Z" fill="none" stroke="#102A43" stroke-width="6" stroke-linejoin="round"/><g fill="#102A43" font-family="Arial, sans-serif" font-weight="700" font-size="27" text-anchor="middle"><text x="400" y="112">personal</text><text x="200" y="575" stroke="#F5F5F5" stroke-width="9" paint-order="stroke" stroke-linejoin="round">ethisch</text><text x="600" y="575" stroke="#F5F5F5" stroke-width="9" paint-order="stroke" stroke-linejoin="round">systemisch</text></g><g stroke="#102A43" stroke-width="5"><circle cx="400" cy="160" r="27" fill="#228BE6"/><circle cx="170" cy="620" r="27" fill="#20C997"/><circle cx="630" cy="620" r="27" fill="#FFD84D"/></g><g fill="#F5F5F5" stroke="#d6dfd7" stroke-width="1.5"><rect x="246" y="290" width="308" height="62" rx="16"/><rect x="195" y="462" width="150" height="62" rx="16"/><rect x="420" y="462" width="224" height="62" rx="16"/></g><g fill="#102A43" font-family="Arial, sans-serif" font-weight="700" font-size="27" text-anchor="middle"><text x="400" y="330">Junge Menschen</text><text x="270" y="502">Eltern</text><text x="532" y="502">Lernbegleiter</text></g></svg>